name: "build & release"
on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

env:
  GODOT_VERSION: 4.6
  EXPORT_NAME: Schnopsn
  PROJECT_PATH: .

jobs:
    build:
        name: Build Schnopsn
        runs-on: ubuntu-24.04
        container:
            image: barichello/godot-ci:mono-4.6
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                lfs: true
            - name: Setup
              run: |
                mkdir -v -p ~/.local/share/godot/export_templates/
                mkdir -v -p ~/.config/
                mv /root/.config/godot ~/.config/godot
                mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
                dotnet workload install android
            - name: Android Debug Apk
              run: |
                cp export_presets.debug.cfg export_presets.cfg
                mkdir -v -p builds/android
                godot --headless --export-debug "Android" $GITHUB_WORKSPACE/builds/android/$EXPORT_NAME.apk
            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                name: ${{ env.EXPORT_NAME }}-android
                path: builds/android/
            - name: Create Release
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@v2
              with:
                files: builds/android/${{ env.EXPORT_NAME }}.apk
