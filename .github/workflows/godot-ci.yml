name: "build & release"
on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

env:
  GODOT_VERSION: 4.6
  EXPORT_NAME: Schnopsn
  PROJECT_PATH: .

jobs:
    build:
        name: Debug Android Build
        runs-on: ubuntu-24.04
        container:
            image: barichello/godot-ci:mono-4.6
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                lfs: true
            - name: Setup
              run: |
                mkdir -v -p ~/.local/share/godot/export_templates/
                mkdir -v -p ~/.config/
                mv /root/.config/godot ~/.config/godot
                mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/
                dotnet workload install android
            - name: Android Debug Apk
              run: |
                cp export_presets.debug.cfg export_presets.cfg
                mkdir -p android/build
                ANDROID_ZIP=$(find ~/.local/share/godot/export_templates -name "android_source.zip" | head -1)
                unzip -o "$ANDROID_ZIP" -d android/build/
                echo "$(basename $(dirname $ANDROID_ZIP))" > android/.build_version
                mkdir -v -p builds/android
                godot --headless --export-debug "Android" $GITHUB_WORKSPACE/builds/android/$EXPORT_NAME.apk
            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                name: ${{ env.EXPORT_NAME }}-android
                path: builds/android/
            - name: Create Release
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@v2
              with:
                files: builds/android/${{ env.EXPORT_NAME }}.apk

    release-android:
        name: Release Android Build
        runs-on: ubuntu-24.04
        container:
            image: barichello/godot-ci:mono-4.6
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                lfs: true
            - name: Setup
              run: |
                mkdir -v -p ~/.local/share/godot/export_templates/
                mkdir -v -p ~/.config/
                mv /root/.config/godot ~/.config/godot
                mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/
                dotnet workload install android
            - name: Decode Keystore
              env:
                KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
              run: echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --ignore-garbage -d > /root/release.keystore
            - name: Android Release APK
              env:
                KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              run: |
                cp export_presets.release.cfg export_presets.cfg
                sed -i "s|keystore/release_password=\".*\"|keystore/release_password=\"$KEYSTORE_PASSWORD\"|g" export_presets.cfg
                sed -i "s|keystore/release_user=\".*\"|keystore/release_user=\"$KEY_ALIAS\"|g" export_presets.cfg
                mkdir -p android/build
                ANDROID_ZIP=$(find ~/.local/share/godot/export_templates -name "android_source.zip" | head -1)
                unzip -o "$ANDROID_ZIP" -d android/build/
                echo "$(basename $(dirname $ANDROID_ZIP))" > android/.build_version
                mkdir -v -p builds/android
                godot --headless --export-release "Android" $GITHUB_WORKSPACE/builds/android/$EXPORT_NAME.aab
            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                name: ${{ env.EXPORT_NAME }}-android-release
                path: builds/android/
            - name: Create Release
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@v2
              with:
                files: builds/android/${{ env.EXPORT_NAME }}.aab
