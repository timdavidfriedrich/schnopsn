name: "build & release"
on:
    push:
        branches:
            - main
        paths-ignore:
            - 'CI_paper/**'
    workflow_dispatch:

env:
  GODOT_VERSION: 4.6
  EXPORT_NAME: Schnopsn
  PROJECT_PATH: .

permissions:
  contents: write

jobs:
    test:
        name: Unit Tests
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: '10.x'
            - name: Run unit tests
              run: dotnet test Schnopsn.Tests/

    version:
        name: Compute Version
        needs: test
        runs-on: ubuntu-24.04
        outputs:
            version_name: ${{ steps.bump.outputs.version_name }}
            version_code: ${{ steps.bump.outputs.version_code }}
            tag: ${{ steps.bump.outputs.tag }}
            should_upload: ${{ steps.bump.outputs.should_upload }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
            - name: Bump version
              id: bump
              run: bash scripts/bump-version.sh
            - name: Upload release notes
              uses: actions/upload-artifact@v4
              with:
                name: release-notes
                path: release-notes.md
            - name: Create and push tag
              if: steps.bump.outputs.should_upload == 'true'
              run: |
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git tag ${{ steps.bump.outputs.tag }}
                git push origin ${{ steps.bump.outputs.tag }}

    build:
        name: Debug Android Build
        needs: version
        runs-on: ubuntu-24.04
        container:
            image: barichello/godot-ci:mono-4.6
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                lfs: true
            - name: Setup
              run: |
                mkdir -v -p ~/.local/share/godot/export_templates/
                mkdir -v -p ~/.config/
                mv /root/.config/godot ~/.config/godot
                mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/
                dotnet workload install android
            - name: Android Debug Apk
              run: |
                cp export_presets.debug.cfg export_presets.cfg
                mkdir -p android/build
                ANDROID_ZIP=$(find ~/.local/share/godot/export_templates -name "android_source.zip" | head -1)
                unzip -o "$ANDROID_ZIP" -d android/build/
                echo "$(basename $(dirname $ANDROID_ZIP))" > android/.build_version
                mkdir -v -p builds/android
                godot --headless --export-debug "Android" $GITHUB_WORKSPACE/builds/android/$EXPORT_NAME.apk
            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                name: ${{ env.EXPORT_NAME }}-android
                path: builds/android/

    release-android:
        name: Release Android Build
        needs: version
        runs-on: ubuntu-24.04
        container:
            image: barichello/godot-ci:mono-4.6
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                lfs: true
            - name: Setup
              run: |
                mkdir -v -p ~/.local/share/godot/export_templates/
                mkdir -v -p ~/.config/
                mv /root/.config/godot ~/.config/godot
                mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/
                dotnet workload install android
            - name: Decode Keystore
              env:
                KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
              run: |
                echo "Keystore secret length: ${#KEYSTORE_BASE64}"
                echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | openssl enc -base64 -d -A > /root/release.keystore
            - name: Android Release AAB
              env:
                KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
                VERSION_NAME: ${{ needs.version.outputs.version_name }}
                VERSION_CODE: ${{ needs.version.outputs.version_code }}
              run: |
                cp export_presets.release.cfg export_presets.cfg
                sed -i "s|keystore/release_password=\".*\"|keystore/release_password=\"$KEYSTORE_PASSWORD\"|g" export_presets.cfg
                sed -i "s|keystore/release_user=\".*\"|keystore/release_user=\"$KEY_ALIAS\"|g" export_presets.cfg
                sed -i "s|version/code=.*|version/code=$VERSION_CODE|g" export_presets.cfg
                sed -i "s|version/name=\".*\"|version/name=\"$VERSION_NAME\"|g" export_presets.cfg
                mkdir -p android/build
                ANDROID_ZIP=$(find ~/.local/share/godot/export_templates -name "android_source.zip" | head -1)
                unzip -o "$ANDROID_ZIP" -d android/build/
                echo "$(basename $(dirname $ANDROID_ZIP))" > android/.build_version
                mkdir -v -p builds/android
                godot --headless --export-release "Android" $GITHUB_WORKSPACE/builds/android/$EXPORT_NAME.aab
            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                name: ${{ env.EXPORT_NAME }}-android-release
                path: builds/android/

    deploy-internal:
        name: Deploy to Play Store (internal)
        needs: [version, release-android]
        if: needs.version.outputs.should_upload == 'true'
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Download AAB
              uses: actions/download-artifact@v4
              with:
                name: ${{ env.EXPORT_NAME }}-android-release
                path: builds/android/
            - name: Download release notes
              uses: actions/download-artifact@v4
              with:
                name: release-notes
                path: .
            - name: Generate per-version changelog
              env:
                VERSION_CODE: ${{ needs.version.outputs.version_code }}
              run: |
                set -euo pipefail
                for locale in en-US de-DE; do
                  dir="fastlane/metadata/android/${locale}/changelogs"
                  next="${dir}/next.txt"
                  default="${dir}/default.txt"
                  target="${dir}/${VERSION_CODE}.txt"
                  if [[ -s "$next" ]]; then
                    echo "[${locale}] next.txt has content -> using it for this release"
                    cp "$next" "$target"
                    : > "$next"
                  else
                    echo "[${locale}] next.txt is empty -> archiving default.txt for this release"
                    cp "$default" "$target"
                  fi
                done
            - name: Setup Ruby
              uses: ruby/setup-ruby@v1
              with:
                ruby-version: '3.2'
                bundler-cache: true
            - name: Write Play Store service account key
              env:
                GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
              run: |
                printf '%s' "$GOOGLE_PLAY_JSON_KEY" > fastlane/play-store-key.json
            - name: Deploy to internal track
              env:
                AAB_PATH: builds/android/${{ env.EXPORT_NAME }}.aab
              run: bundle exec fastlane internal
            - name: Archive changelog history
              env:
                VERSION_CODE: ${{ needs.version.outputs.version_code }}
                TAG: ${{ needs.version.outputs.tag }}
              run: |
                set -euo pipefail
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add \
                  "fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt" \
                  "fastlane/metadata/android/de-DE/changelogs/${VERSION_CODE}.txt" \
                  "fastlane/metadata/android/en-US/changelogs/next.txt" \
                  "fastlane/metadata/android/de-DE/changelogs/next.txt"
                if git diff --cached --quiet; then
                  echo "No changelog changes to commit"
                  exit 0
                fi
                git commit -m "archive changelog for ${TAG}"
                git push origin HEAD:main
            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                tag_name: ${{ needs.version.outputs.tag }}
                name: ${{ needs.version.outputs.tag }}
                body_path: release-notes.md
                files: builds/android/${{ env.EXPORT_NAME }}.aab

    notify-discord:
        name: Notify Discord
        needs: [test, version, build, release-android, deploy-internal]
        runs-on: ubuntu-24.04
        if: always()
        steps:
            - name: Build embed
              run: |
                if [[ "${{ needs.test.result }}" == "success" && \
                      "${{ needs.version.result }}" == "success" && \
                      "${{ needs.build.result }}" == "success" && \
                      "${{ needs.release-android.result }}" == "success" && \
                      ("${{ needs.deploy-internal.result }}" == "success" || \
                       "${{ needs.deploy-internal.result }}" == "skipped") ]]; then
                  LABEL="SUCCESS" COLOR=3066993 EMOJI="✅"
                else
                  LABEL="FAILURE" COLOR=15158332 EMOJI="❌"
                fi
                TAG="${{ needs.version.outputs.tag }}"
                TAG="${TAG:-unknown}"
                RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                COMMIT_MSG="${{ github.event.head_commit.message }}"
                EMBEDS=$(jq -cn \
                  --arg title "${EMOJI} Build & Release ${TAG}" \
                  --arg url  "${RUN_URL}" \
                  --argjson color ${COLOR} \
                  --arg status "${LABEL}" \
                  --arg branch "${{ github.ref_name }}" \
                  --arg commit "${COMMIT_MSG}" \
                  '[{
                    title: $title, url: $url, color: $color,
                    fields: [
                      {name: "Status", value: $status, inline: true},
                      {name: "Branch", value: $branch, inline: true},
                      {name: "Commit", value: $commit, inline: false}
                    ]
                  }]')
                echo "DISCORD_EMBEDS=${EMBEDS}" >> $GITHUB_ENV
            - name: Discord Notification
              uses: Ilshidur/action-discord@0.4.0
              env:
                DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
              with:
                args: ""
